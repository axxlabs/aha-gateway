# Self-hosted aha gateway: the gateway plus Caddy for TLS (SPEC §7.2).
# 1. Point an A/AAAA record for your domain at this server.
# 2. Put AHA_DOMAIN=gateway.example.com and AHA_APP_ORIGIN=https://app.example.com in deploy/.env
#    (serve aha-app's dist/ from that origin, on a static host of your choice, not from the gateway).
#    Optional: AHA_SITES to serve more names (comma-separated; defaults to AHA_DOMAIN), and for problem
#    reports (SPEC §7.7) AHA_REPORTS_REPO=owner/repo plus a GitHub token in secrets/github-token
#    (readable by uid 10001; issues read/write on that private repository, and its account an admin of it).
# 3. AHA_BUILD=$(git rev-parse --short HEAD) docker compose up -d --build   (or podman-compose)
# The gateway's signing key is created on first start in the "keys" volume. Back it up: computers pin it.
services:
  gateway:
    build: { context: .., dockerfile: deploy/Containerfile, args: { AHA_BUILD: "${AHA_BUILD:-unknown}" } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AHA_GW_PUBLIC_URL: https://${AHA_DOMAIN}
      AHA_GW_SIGNING_KEY_FILE: /keys/gateway.key
      AHA_GW_VAPID_KEY_FILE: /keys/vapid.pem
      AHA_GW_APP_ORIGINS: ${AHA_APP_ORIGIN}
      AHA_GW_REPORTS_REPO: ${AHA_REPORTS_REPO:-}
      AHA_GW_GITHUB_TOKEN_FILE: /secrets/github-token
    volumes: [keys:/keys, ./secrets:/secrets:ro]
  caddy:
    image: docker.io/library/caddy@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b  # caddy:2, pinned (SPEC §9.2)
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { AHA_SITES: "${AHA_SITES:-${AHA_DOMAIN}}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
volumes:
  keys: {}
  caddy: {}
