[project]
name = "aha-gateway"
version = "0.1.0"
description = "aha gateway: relays chat messages between chat apps and aha computers, and stores nothing"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "websockets>=14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The production artefact never contains the chat simulator (SPEC §7.4).
packages = ["aha_gateway"]
exclude = ["aha_gateway/staging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
